# Render Blueprint Specification for PriceWise AI Cloud Staging (Phase 13)
# Documentation: https://render.com/docs/blueprint-spec

services:
  # 1. FastAPI Backend API Bridge
  - type: web
    name: pricewise-backend-staging
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.api.main:app --host 0.0.0.0 --port $PORT
    plan: free # Can upgrade to starter ($7/mo) for zero cold starts
    region: frankfurt # or singapore / oregon
    healthCheckPath: /api/health/ready
    envVars:
      - key: ENVIRONMENT
        value: staging
      - key: DATABASE_URL
        sync: false # Set securely to Neon pooled connection string in Render dashboard
      - key: CORS_ORIGINS
        value: "https://pricewise-staging.vercel.app,http://localhost:5173"
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_API_KEY
        sync: false # Set securely in Render dashboard
      - key: SECRET_KEY
        generateValue: true
      # Phase 14 Stage 2.5 (FIX 1): session token signing secret.
      # MANUAL STEP REQUIRED — set this in the Render dashboard
      # (Service -> Environment -> Add -> "AUTH_SECRET_KEY").
      # There is no safe fallback secret: if neither AUTH_SECRET_KEY nor
      # SECRET_KEY is present the service refuses to start rather than signing
      # session tokens with a publicly known value. SECRET_KEY above is still
      # accepted as a legacy alias, so the service keeps running until the
      # canonical variable is added.
      # Rotating this value invalidates every issued session token.
      - key: AUTH_SECRET_KEY
        sync: false
      - key: RATE_LIMIT_PER_MINUTE
        value: "120"

  # 2. Scheduled maintenance worker (Phase 14 Stage E)
  #    Runs one maintenance cycle and exits, which is exactly the contract a
  #    cron scheduler expects:
  #      * price refresh for tracked / watched products (authorised sources
  #        only - it never invents a price),
  #      * watchlist / price-tracking alert evaluation,
  #      * expired deal cleanup.
  #
  #    The schedule below runs every 30 minutes. Change "schedule" to suit
  #    the operational requirement. The worker needs the same DATABASE_URL as
  #    the web service.
  - type: cron
    name: pricewise-scheduler-staging
    runtime: python
    buildCommand: pip install -r requirements.txt
    schedule: "*/30 * * * *"
    region: frankfurt
    envVars:
      - key: ENVIRONMENT
        value: staging
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: AUTH_SECRET_KEY
        sync: false
    command: python -m src.workers.scheduler --once
